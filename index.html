<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartUse India - QR Code Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f5ff;
 color:#172033;
}
header{
 background:linear-gradient(120deg,#102a63,#087bd5);
 color:white;
 text-align:center;
 padding:35px 15px;
}
header h1{font-size:30px;margin:0}
header p{font-size:17px;margin:12px 0 0}
.container{
 max-width:550px;
 margin:35px auto;
 padding:15px;
}
.card{
 background:white;
 padding:25px 20px;
 border-radius:22px;
 box-shadow:0 5px 25px #0001;
 text-align:center;
}
h2{font-size:25px}
label{
 display:block;
 text-align:left;
 font-weight:bold;
 margin:18px 0 8px;
}
select,input{
 width:100%;
 padding:15px;
 border:1px solid #ccd4e2;
 border-radius:10px;
 font-size:16px;
 background:white;
}
button{
 width:100%;
 padding:15px;
 border:0;
 border-radius:10px;
 background:#087bd5;
 color:white;
 font-size:17px;
 font-weight:bold;
 margin-top:18px;
}
button:active{opacity:.8}
#result{
 margin:25px auto;
 display:flex;
 justify-content:center;
}
#result img,#result canvas{
 max-width:100%;
 height:auto;
}
#download{
 background:#159447;
 display:none;
}
#message{
 color:#d22;
 margin-top:12px;
}
footer{
 text-align:center;
 color:#687386;
 padding:25px;
}
</style>
</head>

<body>

<header>
<h1>🌐 SmartUse India</h1>
<p>Free QR Code Generator</p>
</header>

<div class="container">
<div class="card">

<h2>📱 QR Code बनाएं</h2>
<p>अपनी जानकारी डालें और तुरंत QR Code बनाएं।</p>

<label>QR Code का प्रकार चुनें</label>
<select id="type" onchange="changePlaceholder()">
<option value="text">Text / Message</option>
<option value="url">Website Link</option>
<option value="whatsapp">WhatsApp Number</option>
<option value="phone">Mobile Number</option>
</select>

<label>अपनी जानकारी लिखें</label>
<input id="data" type="text" placeholder="यहाँ Text या Link लिखें">

<button onclick="generateQR()">QR Code बनाएं</button>

<p id="message"></p>

<div id="result"></div>

<button id="download" onclick="downloadQR()">⬇ QR Code डाउनलोड करें</button>

</div>
</div>

<footer>
© 2026 SmartUse India<br>
Free QR Code Generator
</footer>

<script>
let qr;

function changePlaceholder(){
 const type=document.getElementById("type").value;
 const input=document.getElementById("data");

 if(type==="url") input.placeholder="https://example.com";
 else if(type==="whatsapp") input.placeholder="91 के साथ मोबाइल नंबर लिखें";
 else if(type==="phone") input.placeholder="मोबाइल नंबर लिखें";
 else input.placeholder="अपना Text या Message लिखें";
}

function generateQR(){

 const type=document.getElementById("type").value;
 const value=document.getElementById("data").value.trim();
 const result=document.getElementById("result");
 const message=document.getElementById("message");
 const download=document.getElementById("download");

 result.innerHTML="";
 download.style.display="none";
 message.innerText="";

 if(!value){
  message.innerText="कृपया पहले जानकारी लिखें।";
  return;
 }

 let finalData=value;

 if(type==="url"){
  if(!/^https?:\/\//i.test(value)){
   message.innerText="सही वेबसाइट लिंक लिखें (https:// से शुरू करें)।";
   return;
  }
 }

 if(type==="whatsapp"){
  let number=value.replace(/\D/g,"");
  if(number.length<10 || number.length>15){
   message.innerText="कृपया सही WhatsApp नंबर लिखें।";
   return;
  }
  finalData="https://wa.me/"+number;
 }

 if(type==="phone"){
  let number=value.replace(/\D/g,"");
  if(number.length<10 || number.length>15){
   message.innerText="कृपया सही मोबाइल नंबर लिखें।";
   return;
  }
  finalData="tel:"+number;
 }

 try{
  qr=new QRCode(result,{
   text:finalData,
   width:230,
   height:230,
   colorDark:"#000000",
   colorLight:"#ffffff",
   correctLevel:QRCode.CorrectLevel.H
  });

  download.style.display="block";
 }catch(error){
  message.innerText="QR Code नहीं बन पाया। दोबारा कोशिश करें।";
 }
}

function downloadQR(){

 const result=document.getElementById("result");
 const canvas=result.querySelector("canvas");
 const img=result.querySelector("img");

 let imageData="";

 if(canvas){
  imageData=canvas.toDataURL("image/png");
 }else if(img){
  imageData=img.src;
 }

 if(!imageData){
  alert("पहले QR Code बनाएं।");
  return;
 }

 const link=document.createElement("a");
 link.href=imageData;
 link.download="SmartUse-QR-Code.png";
 document.body.appendChild(link);
 link.click();
 link.remove();
}
</script>

</body>
 </html>
